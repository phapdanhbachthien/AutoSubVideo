name: Publish Windows portable
on:
  workflow_dispatch:
    inputs:
      asset_ref:
        description: Branch containing release chunks
        required: true
        default: release-assets-v0.1.0-preview
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.asset_ref }}
      - name: Restore package and verify checksum
        run: |
          cat parts/part-* > AutoSubVideo-Windows-x64.zip
          sha256sum --check AutoSubVideo-Windows-x64.sha256
      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0-preview AutoSubVideo-Windows-x64.zip AutoSubVideo-Windows-x64.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v0.1.0-preview --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
