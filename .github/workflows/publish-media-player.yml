name: Publish Thien Media Player
on:
  push:
    branches: [media-player-release-assets]
    paths: [MEDIA_PLAYER_READY]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify portable ZIP
        run: |
          cat release-parts/part-* > ThienMediaPlayer-Windows-x64.zip
          sha256sum --check ThienMediaPlayer-Windows-x64.sha256
      - name: Publish separate media player Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create thien-media-player-v0.1.0-preview --repo "$GITHUB_REPOSITORY" --target media-player --draft --prerelease --title 'Thiên Media Player — Windows x64 (thử nghiệm)' --notes-file RELEASE-NOTES.md
          gh release upload thien-media-player-v0.1.0-preview ThienMediaPlayer-Windows-x64.zip ThienMediaPlayer-Windows-x64.sha256 ThienMediaPlayer-source.zip ThienMediaPlayer.png --repo "$GITHUB_REPOSITORY"
          gh release edit thien-media-player-v0.1.0-preview --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
